<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Range Slider</title>
  <link rel="stylesheet" href="example.css">
</head>
<body>
  <div class="container">
    <h1>Price Range Slider</h1>
    <div class="range-slider">
      <input type="range" min="0" max="1000" value="200" id="min-range" class="range">
      <input type="range" min="0" max="1000" value="800" id="max-range" class="range">
    </div>
    <div class="range-values">
      <div>
        <label for="min-input">Min Price:</label>
        <input type="number" id="min-input" value="200" min="0" max="1000">
      </div>
      <div>
        <label for="max-input">Max Price:</label>
        <input type="number" id="max-input" value="800" min="0" max="1000">
      </div>
    </div>
  </div>

  <script src="example.js"></script>
</body>
</html>
